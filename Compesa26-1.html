        const monthSel = document.getElementById('monthSelector');
        const weekSel = document.getElementById('weekSelector');
        const lessonSel = document.getElementById('lessonSelector');
        const mainContent = document.getElementById('mainContent');
        const emptyState = document.getElementById('emptyState');
        const workArea = document.getElementById('workArea');
        const holidayState = document.getElementById('holidayState');

        function init() {
            monthSel.addEventListener('change', () => {
                const weeks = Object.keys(lessonData[monthSel.value] || {});
                weekSel.innerHTML = '<option value="" disabled selected>Semana</option>';
                weeks.forEach(w => weekSel.add(new Option(w, w)));
                weekSel.disabled = false;
                lessonSel.disabled = true;
                mainContent.classList.add('hidden');
                emptyState.classList.remove('hidden');
            });

            weekSel.addEventListener('change', () => {
                const lessons = lessonData[monthSel.value][weekSel.value];
                lessonSel.innerHTML = '<option value="" disabled selected>Día</option>';
                lessons.forEach((l, i) => lessonSel.add(new Option(`${l.day}: ${l.title}`, i)));
                lessonSel.disabled = false;
            });

            lessonSel.addEventListener('change', () => {
                const lesson = lessonData[monthSel.value][weekSel.value][lessonSel.value];
                showLesson(lesson);
            });
        }

        function showLesson(lesson) {
            emptyState.classList.add('hidden');
            mainContent.classList.remove('hidden');
            document.getElementById('lessonTitle').innerText = lesson.title;
            document.getElementById('breadcrumb').innerText = `${monthSel.value} • ${weekSel.value} • ${lesson.day}`;

            if (lesson.type === 'holiday' || lesson.title.toLowerCase().includes('consultar')) {
                workArea.classList.add('hidden');
                holidayState.classList.remove('hidden');
            } else {
                workArea.classList.remove('hidden');
                holidayState.classList.add('hidden');
                renderQuestions(lesson.q);
            }
        }

        function renderQuestions(questions) {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            questions.forEach((q, i) => {
                const card = document.createElement('div');
                card.className = 'card p-8 animate-in slide-in-from-bottom-2 duration-300';
                card.innerHTML = `
                    <div class="flex gap-4 mb-4">
                        <span class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-xs shrink-0">${i+1}</span>
                        <p class="font-bold text-slate-800 leading-tight">${q}</p>
                    </div>
                    <textarea id="ans-${i}" class="textarea-custom" placeholder="Escribe tu respuesta aquí..."></textarea>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('exportBtn').onclick = () => {
            document.getElementById('nameModal').classList.remove('hidden');
        };

        document.getElementById('confirmBtn').onclick = () => {
            const name = document.getElementById('studentName').value;
            if (!name) return;

            const lesson = lessonData[monthSel.value][weekSel.value][lessonSel.value];
            let printHtml = `
                <div class="mb-10">
                    <p class="text-sm font-bold uppercase tracking-widest text-indigo-600 mb-1">Alumno: ${name}</p>
                    <p class="text-sm font-medium text-slate-400 uppercase">Lección: ${lesson.title} (${lesson.day})</p>
                    <p class="text-[10px] text-slate-300">${monthSel.value} - ${weekSel.value}</p>
                </div>
                <div class="space-y-8">
            `;

            lesson.q.forEach((q, i) => {
                const ans = document.getElementById(`ans-${i}`).value || "Sin respuesta.";
                printHtml += `
                    <div>
                        <p class="font-black text-slate-900 text-sm mb-2">${i+1}. ${q}</p>
                        <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl text-sm italic">
                            ${ans.replace(/\n/g, '<br>')}
                        </div>
                    </div>
                `;
            });

            printHtml += `
                </div>
                <div class="mt-20 flex justify-between border-t border-dashed pt-8">
                    <div class="text-center w-40 border-t border-slate-900 pt-2 text-[10px] font-bold">FIRMA ALUMNO</div>
                    <div class="text-center w-40 border-t border-slate-900 pt-2 text-[10px] font-bold">FIRMA MAESTRO</div>
                </div>
            `;

            document.getElementById('printContent').innerHTML = printHtml;
            document.getElementById('nameModal').classList.add('hidden');
            window.print();
        };

        init();
    </script>
